name: League Hub - fetch Yahoo data

on:
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours (UTC)
  workflow_dispatch:         # manual runs + the web app's Refresh button

concurrency:
  group: league-hub-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-hub.txt

      - run: pip install -r requirements-hub.txt

      - name: Fetch Yahoo data into the sheet
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_OAUTH_TOKEN: ${{ secrets.YAHOO_OAUTH_TOKEN }}
          YAHOO_REDIRECT_URI: ${{ vars.YAHOO_REDIRECT_URI }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LEAGUE_KEY: ${{ vars.LEAGUE_KEY }}
        run: python fetch_to_sheets.py
